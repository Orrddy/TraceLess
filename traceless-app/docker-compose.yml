name: traceless

x-app: &app
  build:
    # Context is the repository root so the image can include python-services
    # and its scanner datasets.
    context: ..
    dockerfile: traceless-app/Dockerfile
    target: runtime
  image: traceless-app:latest
  env_file:
    - .env
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage

services:
  web:
    <<: *app
    environment:
      APP_ROLE: web
    # Single-role supervisor; queue and scheduler are separate services below.
    command:
      - supervisord
      - "-c"
      - /etc/supervisord-role.conf
    ports:
      - "8080:8080"

  queue:
    <<: *app
    environment:
      APP_ROLE: queue
    command:
      - php
      - artisan
      - queue:work
      - --queue=scans,default
      - --sleep=3
      - --tries=1
      - --timeout=610
    healthcheck:
      disable: true

  scheduler:
    <<: *app
    environment:
      APP_ROLE: scheduler
    command:
      - php
      - artisan
      - schedule:work
    healthcheck:
      disable: true

  # One-off migrations: docker compose run --rm migrate
  migrate:
    <<: *app
    profiles:
      - tools
    environment:
      APP_ROLE: migrate
    command:
      - php
      - artisan
      - migrate
      - --force
    restart: "no"
    healthcheck:
      disable: true

volumes:
  storage:
