[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Two queue workers. Each can hold a two-hour deep scan; the database retry window is 8100s.
[program:queue]
user=www-data
command=/bin/sh -c "exec php artisan queue:work --queue=scans,default --sleep=3 --tries=1 --timeout=7800"
process_name=%(program_name)s_%(process_num)02d
numprocs=2
stopwaitsecs=8000
stopasgroup=true
killasgroup=true
directory=/var/www/html
autostart=true
autorestart=true
startsecs=5
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Scheduler: runs monitoring dispatch, retention and the operations watchdog.
[program:scheduler]
user=www-data
command=/bin/sh -c "exec php artisan schedule:work"
directory=/var/www/html
autostart=true
autorestart=true
startsecs=5
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
