[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Scan workers: two deep crawls can run at once and each may hold a two-hour job.
; The database retry window is 8100s so a running scan is never re-delivered.
[program:queue-scans]
user=www-data
command=/bin/sh -c "exec php artisan queue:work --queue=scans --sleep=3 --tries=1 --timeout=7800"
process_name=%(program_name)s_%(process_num)02d
numprocs=2
stopwaitsecs=8000
stopasgroup=true
killasgroup=true
directory=/var/www/html
autostart=true
autorestart=true
startsecs=5
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Default queue stays independent: verification emails, scan-start alerts and
; notifications must never wait behind a two-hour crawl.
[program:queue-default]
user=www-data
command=/bin/sh -c "exec php artisan queue:work --queue=default --sleep=2 --tries=3 --timeout=120"
numprocs=1
stopwaitsecs=130
stopasgroup=true
killasgroup=true
directory=/var/www/html
autostart=true
autorestart=true
startsecs=5
priority=31
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Scheduler: runs monitoring dispatch, retention and the operations watchdog.
[program:scheduler]
user=www-data
command=/bin/sh -c "exec php artisan schedule:work"
directory=/var/www/html
autostart=true
autorestart=true
startsecs=5
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
