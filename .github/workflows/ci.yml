name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  tests:
    name: Tests & style
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traceless-app
    env:
      # Composer runs `artisan package:discover` before .env exists. In
      # production that boots the safety guard (demo mode looks enabled) and
      # aborts the install. APP_ENV=testing keeps that boot out of production
      # mode, and is also correct for the suite: PHPUnit does not overwrite an
      # environment variable that is already set, so CSRF-skipping relies on it.
      APP_ENV: testing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, fileinfo, intl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('traceless-app/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: traceless-app/package-lock.json

      - name: Build front-end
        run: |
          npm ci
          npm run build

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The upstream scanner datasets are not committed (licensing and size),
      # so the image build clones them at a known point in time.
      - name: Stage scanner datasets
        run: |
          rm -rf python-services/upstream
          mkdir -p python-services/upstream
          git clone --depth 1 https://github.com/WebBreacher/WhatsMyName.git python-services/upstream/WhatsMyName
          git clone --depth 1 https://github.com/kaifcodec/user-scanner.git python-services/upstream/user-scanner
          git clone --depth 1 https://github.com/kaifcodec/phonsint.git python-services/upstream/phonsint
          du -sh python-services/upstream

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          # Docker registry names must be lowercase; GitHub handles are not.
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          docker buildx build --platform linux/amd64 --target runtime \
            -f traceless-app/Dockerfile \
            -t "ghcr.io/${OWNER}/traceless:${GITHUB_SHA}" \
            -t "ghcr.io/${OWNER}/traceless:latest" \
            --load .

      - name: Push image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          docker push "ghcr.io/${OWNER}/traceless:${GITHUB_SHA}"
          docker push "ghcr.io/${OWNER}/traceless:latest"

      - name: Push image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          docker push "ghcr.io/${OWNER}/traceless:${GITHUB_SHA}"
          docker push "ghcr.io/${OWNER}/traceless:latest"
