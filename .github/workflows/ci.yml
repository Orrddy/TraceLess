name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  tests:
    name: Tests & style
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traceless-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, fileinfo, intl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('traceless-app/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: |
          set +e
          composer install --prefer-dist --no-interaction --no-progress -vvv 2>&1 | tee /tmp/composer.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(tail -n 25 /tmp/composer.log | tr '\n' '|' | head -c 3500)
            echo "::error title=Composer install failed::$msg"
            echo "=== composer failure tail ==="
            tail -n 25 /tmp/composer.log
            exit 1
          fi

      - name: Record composer failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .ci
          cp /tmp/composer.log .ci/composer-failure.txt 2>/dev/null || echo "no log captured" > .ci/composer-failure.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f .ci/composer-failure.txt
          git commit -m "ci: record composer failure [skip ci]" || true
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main || true

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: traceless-app/package-lock.json

      - name: Build front-end
        run: |
          npm ci
          npm run build

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The upstream scanner datasets are not committed (licensing and size),
      # so the image build clones them at a known point in time.
      - name: Stage scanner datasets
        run: |
          rm -rf python-services/upstream
          mkdir -p python-services/upstream
          git clone --depth 1 https://github.com/WebBreacher/WhatsMyName.git python-services/upstream/WhatsMyName
          git clone --depth 1 https://github.com/kaifcodec/user-scanner.git python-services/upstream/user-scanner
          git clone --depth 1 https://github.com/kaifcodec/phonsint.git python-services/upstream/phonsint
          du -sh python-services/upstream

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: traceless-app/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/traceless:latest
            ghcr.io/${{ github.repository_owner }}/traceless:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
